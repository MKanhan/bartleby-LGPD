[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bartleby-lgpd"
version = "1.1.0"
description = "Bartleby — gate de LGPD para agentes de IA: linter estático que roda no CI, sem LLM."
requires-python = ">=3.11"
authors = [{ name = "Marcelo Kanhan" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
bartleby = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.templates.catalogs" = ["*.yml"]
