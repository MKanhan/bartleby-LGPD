    artigos: [Art. 39, Art. 41]
    probabilidade_baseline: 4
    impacto_baseline: 2
    triggers:
      has_external_provider: true
    mitigacoes:
      - text: Cláusulas contratuais de transparência sobre subprocessamento
        probability_reduction: 2
        impact_reduction: 0

  - id: AI-015
    categoria: governanca
    descricao: Falta de versionamento do modelo
    artigos: [Art. 6º V, Art. 50]
    probabilidade_baseline: 4
    impacto_baseline: 2
    triggers:
      operations: [invoke_llm]
    mitigacoes:
