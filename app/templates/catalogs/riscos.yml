        probability_reduction: 2
        impact_reduction: 0

  - id: AI-016
    categoria: direitos_do_titular
    descricao: Inabilidade técnica de atender direito à eliminação
    artigos: [Art. 18 IV, Art. 18 VI, Art. 16]
    probabilidade_baseline: 4
    impacto_baseline: 3
    triggers:
      operations: [embed, vector_store_write, vector_store_init, memory_persist]
