# Risk catalog — source of truth for the Risk Map generator.
# Each entry mirrors docs/legal/ai_risk_catalog.md.
# Triggers:
#   operations: list of scanner kinds that imply this risk
#   has_pii: boolean — true if scan emits any PII finding
#   has_external_provider: boolean — true if any operation has a provider
#   has_telemetry / has_memory_store / has_vector_store: derived flags
#   always: boolean — the risk always applies (classical foundation risks)
# Mitigations:
#   text (str), probability_reduction (int, default 1), impact_reduction (int, default 0)

risks:
  - id: AI-001
    categoria: confidencialidade
    descricao: Vazamento de PII via prompt para provider externo
    artigos: [Art. 6º VII, Art. 33-36, Res. 19/2024]
    probabilidade_baseline: 4
    impacto_baseline: 4
    triggers:
      operations: [invoke_llm, embed]
      has_external_provider: true
    mitigacoes:
      - text: Redaction automática de PII antes de enviar ao LLM
        probability_reduction: 2
        impact_reduction: 0
      - text: DPA + opt-out de treinamento ativado no provider
        probability_reduction: 1
        impact_reduction: 0
      - text: Cláusulas-padrão ANPD anexadas ao contrato
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-002
    categoria: confidencialidade
    descricao: Reidentificação via embeddings armazenados
    artigos: [Art. 5º XI, Art. 6º VII]
    probabilidade_baseline: 3
    impacto_baseline: 4
    triggers:
      operations: [embed, vector_store_write, vector_store_init]
      has_vector_store: true
    mitigacoes:
      - text: Pseudonimização antes da vetorização
        probability_reduction: 1
        impact_reduction: 1
      - text: Controle de acesso granular ao vector store
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-003
    categoria: integridade
    descricao: Prompt injection / jailbreak levando a exfiltração
    artigos: [Art. 46, Art. 47]
    probabilidade_baseline: 4
    impacto_baseline: 4
    triggers:
      operations: [invoke_llm]
    mitigacoes:
      - text: Sanitização de inputs e guardrails (filtros antes e depois)
        probability_reduction: 2
        impact_reduction: 0
      - text: Princípio de menor privilégio nas tools e isolamento por usuário
        probability_reduction: 1
        impact_reduction: 1

  - id: AI-004
    categoria: direitos_do_titular
    descricao: Decisão automatizada sem revisão humana (Art. 20)
    artigos: [Art. 20, Art. 18]
    probabilidade_baseline: 3
    impacto_baseline: 5
    triggers:
      operations: [invoke_llm, tool_call]
    mitigacoes:
      - text: Canal formal de solicitação de revisão humana
        probability_reduction: 1
        impact_reduction: 2
      - text: Documentação explícita dos critérios aplicados
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-005
    categoria: principios
    descricao: Discriminação algorítmica (Art. 6º IX)
    artigos: [Art. 6º IX]
    probabilidade_baseline: 3
    impacto_baseline: 4
    triggers:
      operations: [invoke_llm]
    mitigacoes:
      - text: Testes de viés com equipe multidisciplinar
        probability_reduction: 1
        impact_reduction: 1
      - text: Benchmarks de fairness e monitoramento contínuo
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-006
    categoria: qualidade
    descricao: Alucinação com efeito sobre titular
    artigos: [Art. 6º V]
    probabilidade_baseline: 4
    impacto_baseline: 3
    triggers:
      operations: [invoke_llm]
    mitigacoes:
      - text: Validação de saída contra fonte de verdade (grounding via RAG)
        probability_reduction: 1
        impact_reduction: 1
      - text: Revisão humana antes de decisões ou publicações
        probability_reduction: 1
        impact_reduction: 1

  - id: AI-007
    categoria: transparencia
    descricao: Falta de transparência sobre uso de IA
    artigos: [Art. 6º VI, Art. 9º, Art. 20]
    probabilidade_baseline: 4
    impacto_baseline: 2
    triggers:
      operations: [invoke_llm]
    mitigacoes:
      - text: Aviso explícito de interação com IA
        probability_reduction: 2
        impact_reduction: 0
      - text: Documentação pública dos critérios gerais
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-008
    categoria: transferencia_internacional
    descricao: Transferência internacional sem base (Arts. 33-36 + Res. 19/2024)
    artigos: [Art. 33, Art. 34, Art. 35, Art. 36, Res. 19/2024]
    probabilidade_baseline: 5
    impacto_baseline: 3
    triggers:
      has_external_provider: true
    mitigacoes:
      - text: DPA com cláusulas-padrão ANPD assinadas
        probability_reduction: 3
        impact_reduction: 0
      - text: Avaliação de adequação do país de destino
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-009
    categoria: ciclo_de_vida
    descricao: Retenção indevida em memória de longo prazo
    artigos: [Art. 15, Art. 16, Art. 6º III]
    probabilidade_baseline: 4
    impacto_baseline: 3
    triggers:
      has_memory_store: true
    mitigacoes:
      - text: TTL configurado explicitamente e eliminação programática
        probability_reduction: 2
        impact_reduction: 0
      - text: Política de retenção documentada
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-010
    categoria: base_legal
    descricao: Uso de dados em treinamento sem base legal
    artigos: [Art. 7º, Art. 11, Art. 6º I]
    probabilidade_baseline: 3
    impacto_baseline: 4
    triggers:
      has_external_provider: true
    mitigacoes:
      - text: Opt-out de treinamento ativado por padrão nos contratos
        probability_reduction: 2
        impact_reduction: 0
      - text: Preferência por tiers enterprise que proíbem treino
        probability_reduction: 1
        impact_reduction: 1

  - id: AI-011
    categoria: seguranca
    descricao: Logs de observability com PII
    artigos: [Art. 46]
    probabilidade_baseline: 5
    impacto_baseline: 3
    triggers:
      has_telemetry: true
    mitigacoes:
      - text: Redaction de PII antes de logar
        probability_reduction: 3
        impact_reduction: 0
      - text: ACL nos logs e retenção curta
        probability_reduction: 1
        impact_reduction: 1

  - id: AI-012
    categoria: controle
    descricao: Function call com efeito colateral em sistemas externos
    artigos: [Art. 46, Art. 20]
    probabilidade_baseline: 3
    impacto_baseline: 4
    triggers:
      operations: [tool_call]
    mitigacoes:
      - text: Human-in-the-loop para ações sensíveis
        probability_reduction: 1
        impact_reduction: 1
      - text: Allowlist de destinos e ações
        probability_reduction: 1
        impact_reduction: 0

  - id: AI-013
    categoria: confidencialidade
    descricao: Extração de dados de treinamento (model inversion)
    artigos: [Art. 46]
    probabilidade_baseline: 2
    impacto_baseline: 4
    triggers:
      operations: [invoke_llm]
    mitigacoes:
      - text: Differential privacy no fine-tuning
        probability_reduction: 1
        impact_reduction: 1
      - text: Redução de overfitting
        probability_reduction: 0
        impact_reduction: 1

  - id: AI-014
    categoria: governanca
