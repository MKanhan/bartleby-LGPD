[project]
name = "acme-triage-agent"
version = "0.1.0"
description = "Fictional insurance claim triage agent for Bartleby demos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.6",
    "openai>=1.55",
    "anthropic>=0.40",
    "pinecone-client>=4.0",
    "redis>=5.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langsmith>=0.1.140",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
